name: clickhouse-hw2

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.10
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - zk-data:/var/lib/zookeeper/data
      - zk-log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.9.10
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:9092",
          "--list"
        ]
      interval: 5s
      timeout: 10s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      CLICKHOUSE_USER: student
      CLICKHOUSE_PASSWORD: student
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "clickhouse-client",
          "--user",
          "student",
          "--password",
          "student",
          "--query",
          "SHOW CREATE TABLE hw2.kafka_to_transactions"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  producer:
    build: ./start
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./data:/data:ro
      - ./sql:/sql:ro
      - ./result:/result

volumes:
  zk-data:
  zk-log:
  kafka-data:
  clickhouse-data: